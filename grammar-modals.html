<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Verbs — English Shekho Grammar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080f;--surface:#080e1a;--surface2:#0c1322;
  --border:rgba(255,255,255,.055);--gold:#f5c842;--teal:#2dd4bf;
  --rose:#fb7185;--indigo:#818cf8;--emerald:#34d399;--orange:#fb923c;
  --muted:#64748b;--sub:#94a3b8;--text:#f0f4f8;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 0% 0%,rgba(251,146,60,.06),transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 100%,rgba(245,200,66,.05),transparent 55%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.007) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.007) 1px,transparent 1px);
  background-size:52px 52px;}

.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--border);position:sticky;top:0;
  background:rgba(4,8,15,.9);backdrop-filter:blur(20px);z-index:100;
  box-shadow:0 2px 20px rgba(0,0,0,.4);}
.tb-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.tb-icon{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,rgba(251,146,60,.2),rgba(245,200,66,.1));
  border:1px solid rgba(251,146,60,.3);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.tb-name{font-size:1rem;font-weight:800;background:linear-gradient(135deg,#fb923c,#f5c842);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px;}
.tb-page{font-size:.85rem;color:var(--muted);font-weight:600;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tb-btn{padding:.35rem .85rem;border-radius:20px;font-size:12px;font-weight:600;
  color:var(--sub);text-decoration:none;border:1px solid var(--border);
  background:rgba(255,255,255,.03);transition:.2s;font-family:'Outfit',sans-serif;}
.tb-btn:hover{color:var(--text);border-color:rgba(251,146,60,.3);}
.nav-av{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,rgba(245,200,66,.15),rgba(45,212,191,.15));
  border:2px solid rgba(245,200,66,.2);display:flex;align-items:center;
  justify-content:center;font-size:.9rem;overflow:hidden;cursor:pointer;flex-shrink:0;}
.nav-av img{width:100%;height:100%;object-fit:cover;}

.layout{display:flex;height:calc(100vh - 57px);}
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);
  overflow-y:auto;background:rgba(8,14,26,.6);padding:.8rem .6rem;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(251,146,60,.2);border-radius:3px;}
.sb-section-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:1.2px;font-weight:700;padding:.5rem .7rem .3rem;font-family:'JetBrains Mono',monospace;}
.sb-item{display:flex;align-items:center;gap:8px;padding:.5rem .7rem;
  border-radius:10px;cursor:pointer;transition:.2s;border:1px solid transparent;margin-bottom:2px;}
.sb-item:hover{background:rgba(251,146,60,.06);border-color:rgba(251,146,60,.1);}
.sb-item.active{background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.25);color:var(--orange);}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-text{font-size:12.5px;font-weight:600;flex:1;}
.sb-lvl{font-size:9px;font-family:'JetBrains Mono',monospace;padding:1px 6px;border-radius:20px;font-weight:700;flex-shrink:0;}
.lvl-a1{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2);}
.lvl-a2{background:rgba(245,200,66,.1);color:#f5c842;border:1px solid rgba(245,200,66,.2);}
.lvl-b1{background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.2);}
.lvl-b2{background:rgba(251,113,133,.1);color:#fb7185;border:1px solid rgba(251,113,133,.2);}

.main{flex:1;overflow-y:auto;padding:2rem 2.2rem 4rem;}
.main::-webkit-scrollbar{width:4px;}
.main::-webkit-scrollbar-thumb{background:rgba(251,146,60,.15);border-radius:3px;}

.lesson-header{margin-bottom:2rem;}
.lesson-breadcrumb{font-size:11px;color:var(--muted);margin-bottom:.6rem;font-family:'JetBrains Mono',monospace;}
.lesson-title{font-size:2rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.5rem;line-height:1.15;}
.lesson-title span{background:linear-gradient(135deg,#fb923c,#f5c842);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.lesson-desc{font-size:14px;color:var(--sub);line-height:1.75;max-width:640px;font-family:'Noto Sans Bengali',sans-serif;}
.lesson-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:.8rem;}
.lmeta{font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--border);padding:4px 12px;border-radius:20px;}

.card{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1.4rem;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,linear-gradient(90deg,var(--orange),var(--gold)));opacity:.6;}
.card-title{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:1.1rem;display:flex;align-items:center;gap:.5rem;font-family:'JetBrains Mono',monospace;}
.card-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}

/* MODAL HERO */
.modal-heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:1.4rem;}
.m-hero{border-radius:16px;padding:1rem .6rem;text-align:center;border:1px solid;}
.m-word{font-size:1.4rem;font-weight:900;font-family:'JetBrains Mono',monospace;margin-bottom:.25rem;}
.m-label{font-size:10px;color:var(--muted);font-family:'Noto Sans Bengali',sans-serif;line-height:1.4;}

.formula{background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.18);border-radius:14px;padding:1rem 1.4rem;margin-bottom:1rem;}
.formula-label{font-size:10px;color:var(--orange);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:.4rem;font-family:'JetBrains Mono',monospace;}
.formula-text{font-size:1rem;color:var(--text);line-height:1.8;font-family:'JetBrains Mono',monospace;}
.hl{color:var(--gold);font-weight:700;}
.hl2{color:var(--teal);font-weight:700;}
.hl3{color:var(--rose);font-weight:700;}

.examples{display:flex;flex-direction:column;gap:.6rem;}
.ex{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;padding:.8rem 1.1rem;transition:.2s;}
.ex:hover{border-color:rgba(251,146,60,.2);transform:translateX(4px);}
.ex-en{font-size:14px;font-weight:600;margin-bottom:.25rem;}
.ex-bn{font-size:12.5px;color:var(--muted);font-family:'Noto Sans Bengali',sans-serif;}
.ex-tag{font-size:10px;font-family:'JetBrains Mono',monospace;padding:1px 8px;border-radius:20px;margin-left:8px;font-weight:700;background:rgba(251,146,60,.1);color:var(--orange);}

.gtable{width:100%;border-collapse:collapse;font-size:13px;}
.gtable th{background:rgba(251,146,60,.08);color:var(--orange);font-weight:700;padding:.65rem .9rem;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid rgba(251,146,60,.15);}
.gtable td{padding:.6rem .9rem;border-bottom:1px solid rgba(255,255,255,.04);}
.gtable tr:last-child td{border-bottom:none;}
.gtable tr:hover td{background:rgba(255,255,255,.02);}
.gtable td:first-child{color:var(--text);font-weight:600;}
.gtable td:nth-child(2){color:var(--teal);font-family:'JetBrains Mono',monospace;font-size:12.5px;}
.gtable td:nth-child(3){color:var(--muted);font-family:'Noto Sans Bengali',sans-serif;font-size:12px;}
.correct{color:var(--emerald)!important;font-weight:700;}
.wrong{color:var(--rose)!important;}

/* DEGREE METER */
.degree-meter{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem;}
.degree-row{display:flex;align-items:center;gap:10px;}
.degree-label{font-size:13px;font-weight:700;width:90px;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.degree-bar-bg{flex:1;height:8px;background:rgba(255,255,255,.04);border-radius:20px;overflow:hidden;}
.degree-bar-fill{height:100%;border-radius:20px;}
.degree-pct{font-size:11px;color:var(--muted);width:50px;text-align:right;font-family:'JetBrains Mono',monospace;}

.tip{background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.2);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;display:flex;gap:.8rem;}
.tip-icon{font-size:1.3rem;flex-shrink:0;}
.tip-text{font-size:13px;line-height:1.7;font-family:'Noto Sans Bengali',sans-serif;color:var(--sub);}
.tip-text strong{color:var(--orange);}
.warn{background:rgba(251,113,133,.05);border:1px solid rgba(251,113,133,.18);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;display:flex;gap:.8rem;}
.warn-text{font-size:13px;line-height:1.7;font-family:'Noto Sans Bengali',sans-serif;color:var(--sub);}
.warn-text strong{color:var(--rose);}

.practice-q{background:rgba(251,146,60,.04);border:1px solid rgba(251,146,60,.15);border-radius:14px;padding:1.2rem;margin-bottom:.8rem;}
.pq-text{font-size:14px;font-weight:600;margin-bottom:.6rem;}
.pq-options{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem;}
.pq-opt{padding:.4rem 1rem;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;transition:.2s;font-family:'JetBrains Mono',monospace;}
.pq-opt:hover{border-color:rgba(251,146,60,.3);color:var(--orange);}
.pq-opt.correct{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--emerald);}
.pq-opt.wrong{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3);color:var(--rose);}
.pq-feedback{font-size:13px;padding:.5rem .8rem;border-radius:8px;display:none;font-family:'Noto Sans Bengali',sans-serif;margin-top:.4rem;}
.pq-feedback.show{display:block;}
.pq-feedback.correct{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);color:var(--emerald);}
.pq-feedback.wrong{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.2);color:var(--rose);}

.lesson-nav{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap;align-items:center;}
.btn-prev,.btn-next{display:flex;align-items:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;transition:.2s;text-decoration:none;}
.btn-prev:hover,.btn-next:hover{background:rgba(251,146,60,.08);border-color:rgba(251,146,60,.25);color:var(--text);}
.btn-next{background:linear-gradient(135deg,rgba(251,146,60,.12),rgba(245,200,66,.08));border-color:rgba(251,146,60,.25);color:var(--text);margin-left:auto;}
.btn-quiz-big{background:linear-gradient(135deg,#fb923c,#f5c842);color:#000;border:none;border-radius:14px;padding:.75rem 1.6rem;font-size:14px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif;transition:.2s;}
.btn-quiz-big:hover{opacity:.88;transform:translateY(-1px);}

.progress-strip{position:fixed;top:57px;left:0;right:0;height:3px;z-index:99;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));transition:width .3s;}

@media(max-width:768px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;height:auto;max-height:200px;border-right:none;border-bottom:1px solid var(--border);}
  .main{padding:1.2rem 1rem 3rem;}
  .modal-heroes{grid-template-columns:repeat(4,1fr);}
  .degree-label{width:70px;font-size:11px;}
}
</style>

  <meta name="theme-color" content="#101827">
  <link rel="stylesheet" href="styles/ux-polish.css">
</head>
<body>

<div class="progress-strip"><div class="progress-fill" id="prog" style="width:0%"></div></div>

<div class="topbar">
  <a class="tb-logo" href="grammar.html">
    <div class="tb-icon">📚</div>
    <div class="tb-name">English Shekho</div>
  </a>
  <div class="tb-sep"></div>
  <div class="tb-page">🔧 Modal Verbs</div>
  <div class="tb-right">
    <a class="tb-btn" href="grammar.html">← Grammar Hub</a>
    <a class="tb-btn" href="dashboard.html">Dashboard</a>
    <div class="nav-av" id="nav-av" onclick="location.href='profile.html'">👤</div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sb-section-label">Modal Verbs</div>
    <div class="sb-item active" data-id="can" onclick="show('can',0)">
      <span class="sb-dot" style="background:#34d399"></span><span class="sb-text">Can / Could</span><span class="sb-lvl lvl-a1">A1</span>
    </div>
    <div class="sb-item" data-id="may" onclick="show('may',1)">
      <span class="sb-dot" style="background:#2dd4bf"></span><span class="sb-text">May / Might</span><span class="sb-lvl lvl-a2">A2</span>
    </div>
    <div class="sb-item" data-id="must" onclick="show('must',2)">
      <span class="sb-dot" style="background:#fb7185"></span><span class="sb-text">Must / Have to</span><span class="sb-lvl lvl-a2">A2</span>
    </div>
    <div class="sb-item" data-id="should" onclick="show('should',3)">
      <span class="sb-dot" style="background:#f5c842"></span><span class="sb-text">Should / Ought to</span><span class="sb-lvl lvl-a2">A2</span>
    </div>
    <div class="sb-item" data-id="will" onclick="show('will',4)">
      <span class="sb-dot" style="background:#818cf8"></span><span class="sb-text">Will / Would</span><span class="sb-lvl lvl-a2">A2</span>
    </div>
    <div class="sb-item" data-id="compare" onclick="show('compare',5)">
      <span class="sb-dot" style="background:#fb923c"></span><span class="sb-text">Degree of Certainty</span><span class="sb-lvl lvl-b1">B1</span>
    </div>
    <div class="sb-item" data-id="practice" onclick="show('practice',6)">
      <span class="sb-dot" style="background:#34d399"></span><span class="sb-text">Practice Quiz</span>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script>
const PANELS={

'can':()=>`
<div class="lesson-header">
  <div class="lesson-breadcrumb">Grammar → Modals → Can / Could</div>
  <div class="lesson-meta"><span class="sb-lvl lvl-a1" style="padding:4px 12px">A1</span><span class="lmeta">⚡ 50 XP</span><span class="lmeta">⏱️ 15 min</span></div>
  <div class="lesson-title" style="margin-top:.5rem"><span>Can / Could</span></div>
  <div class="lesson-desc">Can/Could ব্যবহার করা হয় সক্ষমতা, অনুমতি, এবং অনুরোধ বোঝাতে। Could হলো Can-এর past form, এবং বেশি polite।</div>
</div>

<div class="modal-heroes">
  <div class="m-hero" style="background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.25)"><div class="m-word" style="color:#34d399">can</div><div class="m-label">পারি (বর্তমান)</div></div>
  <div class="m-hero" style="background:rgba(45,212,191,.08);border-color:rgba(45,212,191,.25)"><div class="m-word" style="color:#2dd4bf">could</div><div class="m-label">পারতাম (past/polite)</div></div>
  <div class="m-hero" style="background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.25)"><div class="m-word" style="color:#fb7185;font-size:1rem">can't/<br>couldn't</div><div class="m-label">পারি না/পারতাম না</div></div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--emerald),var(--teal))">
  <div class="card-title">📐 Formula</div>
  <div class="formula"><div class="formula-label">Structure</div>
    <div class="formula-text">Subject + <span class="hl">can/could</span> + <span class="hl2">V1 (base form)</span></div>
  </div>
  <div class="formula"><div class="formula-label">Negative</div>
    <div class="formula-text">Subject + <span class="hl">can't / couldn't</span> + V1</div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--gold),var(--orange))">
  <div class="card-title">📌 কখন ব্যবহার করবেন</div>
  <table class="gtable">
    <tr><th>ব্যবহার</th><th>উদাহরণ</th><th>বাংলা</th></tr>
    <tr><td>সক্ষমতা (Ability)</td><td>I <b>can</b> swim.</td><td>আমি সাঁতার কাটতে পারি।</td></tr>
    <tr><td>অতীত সক্ষমতা</td><td>I <b>could</b> swim when I was 5.</td><td>৫ বছর বয়সে আমি সাঁতার কাটতে পারতাম।</td></tr>
    <tr><td>অনুমতি (Permission)</td><td><b>Can</b> I leave early today?</td><td>আমি কি আজ আগে যেতে পারি?</td></tr>
    <tr><td>ভদ্র অনুরোধ</td><td><b>Could</b> you help me, please?</td><td>আপনি কি আমাকে সাহায্য করতে পারবেন?</td></tr>
    <tr><td>সম্ভাবনা (possibility)</td><td>It <b>could</b> rain later.</td><td>পরে বৃষ্টি হতে পারে।</td></tr>
  </table>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--teal),var(--emerald))">
  <div class="card-title">💬 Examples</div>
  <div class="examples">
    <div class="ex"><div class="ex-en">She <b>can</b> speak three languages. <span class="ex-tag">ability</span></div><div class="ex-bn">সে তিনটি ভাষায় কথা বলতে পারে।</div></div>
    <div class="ex"><div class="ex-en"><b>Can</b> you pass me the salt?  <span class="ex-tag">request</span></div><div class="ex-bn">তুমি কি লবণটা দিতে পারবে?</div></div>
    <div class="ex"><div class="ex-en"><b>Could</b> I use your phone for a minute? <span class="ex-tag">polite</span></div><div class="ex-bn">আমি কি একটু আপনার ফোন ব্যবহার করতে পারি?</div></div>
    <div class="ex"><div class="ex-en">I <b>can't</b> understand this question.</div><div class="ex-bn">আমি এই প্রশ্নটা বুঝতে পারছি না।</div></div>
    <div class="ex"><div class="ex-en">When I was young, I <b>could</b> run very fast.</div><div class="ex-bn">ছোটবেলায় আমি খুব জোরে দৌড়াতে পারতাম।</div></div>
  </div>
</div>

<div class="tip"><span class="tip-icon">💡</span>
  <div class="tip-text"><strong>Can vs Could politeness:</strong> "Can you...?" সাধারণ, কিন্তু "Could you...?" বেশি ভদ্র — অপরিচিত ব্যক্তি বা formal পরিস্থিতিতে Could ব্যবহার করো।</div>
</div>

<div class="warn"><span style="font-size:1.2rem">⚠️</span>
  <div class="warn-text">Modal verb এর পরে সবসময় V1 (base form), কখনো "to" নয়! ❌ "I can to swim" → ✅ "I can swim"</div>
</div>

<div class="lesson-nav">
  <a class="btn-prev" href="grammar-pronouns.html">← Pronouns</a>
  <button class="btn-quiz-big" onclick="show('practice',6)">✍️ Practice</button>
  <button class="btn-next" onclick="show('may',1)">May / Might →</button>
</div>`,

'may':()=>`

'must':()=>`
<div class="lesson-header">

</div>

<div class="modal-heroes">

  <div class="m-hero" style="background:rgba(129,140,248,.08);border-color:rgba(129,140,248,.25)"><div class="m-word" style="color:#818cf8">mustn't</div><div class="m-label">করা নিষেধ</div></div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--rose),var(--gold))">

    <tr><th>Form</th><th>অর্থ</th><th>উদাহরণ</th></tr>

    <tr><td><span style="color:var(--emerald)">don't have to</span></td><td>করার <strong style="color:var(--emerald)">প্রয়োজন নেই</strong> (No obligation)</td><td>You <b>don't have to</b> come. (ইচ্ছা)</td></tr>

<div class="modal-heroes">

</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--gold),var(--teal))">
  <div class="card-title">📐 Formula</div>

    <div class="formula-text">Subject + <span class="hl">should/ought to</span> + <span class="hl2">V1</span></div>
  </div>
  <div class="formula"><div class="formula-label">Past Advice (অতীতে যা করা উচিত ছিল)</div>
    <div class="formula-text">Subject + <span class="hl">should have</span> + <span class="hl3">V3</span></div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--gold),var(--orange))">
  <div class="card-title">📌 কখন ব্যবহার করবেন</div>
  <table class="gtable">
    <tr><th>ব্যবহার</th><th>উদাহরণ</th><th>বাংলা</th></tr>
    <tr><td>পরামর্শ</td><td>You <b>should</b> see a doctor.</td><td>তোমার ডাক্তার দেখানো উচিত।</td></tr>
    <tr><td>প্রত্যাশা</td><td>The bus <b>should</b> arrive soon.</td><td>বাসটা শীঘ্রই আসা উচিত।</td></tr>
    <tr><td>Formal পরামর্শ</td><td>Students <b>ought to</b> respect teachers.</td><td>ছাত্রদের শিক্ষকদের সম্মান করা উচিত।</td></tr>
    <tr><td>অতীতের ভুল (regret)</td><td>You <b>should have</b> told me earlier.</td><td>তোমার আগে আমাকে বলা উচিত ছিল।</td></tr>
  </table>
</div>

    <div class="ex"><div class="ex-en">We <b>shouldn't</b> waste food.</div><div class="ex-bn">আমাদের খাবার অপচয় করা উচিত নয়।</div></div>
    <div class="ex"><div class="ex-en">I <b>should have</b> studied more for the exam.</div><div class="ex-bn">পরীক্ষার জন্য আমার আরও পড়া উচিত ছিল। (কিন্তু পড়িনি)</div></div>
    <div class="ex"><div class="ex-en">You <b>ought to</b> apologize to her.</div><div class="ex-bn">তোমার তার কাছে ক্ষমা চাওয়া উচিত।</div></div>
  </div>
</div>

<div class="tip"><span class="tip-icon">💡</span>

</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--rose),var(--emerald))">
  <div class="card-title">📊 Certainty Scale — উচ্চ থেকে নিম্ন</div>
  <div class="degree-meter">
    <div class="degree-row"><div class="degree-label" style="color:#34d399">must</div><div class="degree-bar-bg"><div class="degree-bar-fill" style="width:95%;background:linear-gradient(90deg,#34d399,#2dd4bf)"></div></div><div class="degree-pct">~95%</div></div>
    <div class="degree-row"><div class="degree-label" style="color:#2dd4bf">will</div><div class="degree-bar-bg"><div class="degree-bar-fill" style="width:90%;background:linear-gradient(90deg,#2dd4bf,#818cf8)"></div></div><div class="degree-pct">~90%</div></div>
    <div class="degree-row"><div class="degree-label" style="color:#f5c842">should</div><div class="degree-bar-bg"><div class="degree-bar-fill" style="width:70%;background:linear-gradient(90deg,#f5c842,#fb923c)"></div></div><div class="degree-pct">~70%</div></div>
    <div class="degree-row"><div class="degree-label" style="color:#fb923c">may</div><div class="degree-bar-bg"><div class="degree-bar-fill" style="width:50%;background:linear-gradient(90deg,#fb923c,#fb7185)"></div></div><div class="degree-pct">~50%</div></div>
    <div class="degree-row"><div class="degree-label" style="color:#818cf8">might</div><div class="degree-bar-bg"><div class="degree-bar-fill" style="width:30%;background:linear-gradient(90deg,#818cf8,#fb7185)"></div></div><div class="degree-pct">~30%</div></div>
    <div class="degree-row"><div class="degree-label" style="color:#fb7185">could</div><div class="degree-bar-bg"><div class="degree-bar-fill" style="width:25%;background:linear-gradient(90deg,#fb7185,#f5c842)"></div></div><div class="degree-pct">~25%</div></div>
    <div class="degree-row"><div class="degree-label" style="color:#fb7185">can't</div><div class="degree-bar-bg"><div class="degree-bar-fill" style="width:5%;background:#fb7185"></div></div><div class="degree-pct">~5%</div></div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--gold),var(--orange))">
  <div class="card-title">💬 Examples — একই পরিস্থিতি, ভিন্ন নিশ্চয়তা</div>
  <div class="examples">
    <div class="ex"><div class="ex-en">She <b>must</b> be at home — her car is in the driveway. <span class="ex-tag">95% নিশ্চিত</span></div><div class="ex-bn">সে অবশ্যই বাড়িতে আছে — তার গাড়ি আছে।</div></div>
    <div class="ex"><div class="ex-en">She <b>should</b> be home by now. <span class="ex-tag">~70%</span></div><div class="ex-bn">তার এখন বাড়িতে থাকার কথা।</div></div>
    <div class="ex"><div class="ex-en">She <b>may</b> be home, I'm not sure. <span class="ex-tag">~50%</span></div><div class="ex-bn">সে বাড়িতে থাকতে পারে, নিশ্চিত নই।</div></div>
    <div class="ex"><div class="ex-en">She <b>might</b> be at the gym instead. <span class="ex-tag">~30%</span></div><div class="ex-bn">সে জিমেও থাকতে পারে।</div></div>
    <div class="ex"><div class="ex-en">She <b>can't</b> be home — I just saw her at the office. <span class="ex-tag">~5% (অসম্ভব)</span></div><div class="ex-bn">সে বাড়িতে থাকতে পারে না — আমি তাকে অফিসে দেখলাম।</div></div>
  </div>
</div>

<div class="warn"><span style="font-size:1.2rem">⚠️</span>
  <div class="warn-text"><strong>"Mustn't" vs "Can't" (নিশ্চয়তা প্রসঙ্গে):</strong><br>
  Negative নিশ্চয়তায় <strong>"can't"</strong> ব্যবহার হয়, "mustn't" নয়।<br>
  ❌ "He mustn't be at home." → ✅ "He <strong>can't</strong> be at home." (অসম্ভব বোঝাতে)</div>
</div>

<div class="lesson-nav">
  <button class="btn-prev" onclick="show('will',4)">← Will / Would</button>
  <button class="btn-next" onclick="show('practice',6)">Practice Quiz →</button>
</div>`,

'practice':()=>`
<div class="lesson-header">
  <div class="lesson-breadcrumb">Grammar → Modals → Practice</div>
  <div class="lesson-title" style="margin-top:.5rem"><span>✍️ Modal Verbs Practice Quiz</span></div>
  <div class="lesson-desc">সঠিক modal verb বেছে নাও।</div>
</div>
<div id="quiz-wrap"></div>
<div class="lesson-nav" style="margin-top:1.5rem">
  <button class="btn-prev" onclick="show('compare',5)">← Degree of Certainty</button>
  <button class="btn-quiz-big" onclick="resetQuiz()">🔄 আবার চেষ্টা করো</button>
  <a class="btn-next" href="grammar-voice.html">Active/Passive Voice →</a>
</div>`
};

const QUIZ=[
  {q:'I ___ swim very well when I was young.',          opts:['can','could','must','should'], ans:'could',  exp:'অতীত সক্ষমতা → could'},
  {q:'___ I borrow your pen, please? (formal)',          opts:['Can','May','Must','Will'],     ans:'May',     exp:'Formal অনুমতি → May'},
  {q:'You ___ wear a seatbelt — it\'s the law.',         opts:['can','should','have to','might'],ans:'have to',exp:'আইন/বাহ্যিক নিয়ম → have to'},
  {q:'You ___ smoke in the hospital. (নিষেধ)',           opts:['don\'t have to','mustn\'t','might not','can'],ans:'mustn\'t',exp:'নিষেধ বোঝাতে → mustn\'t'},
  {q:'You ___ come if you don\'t want to. (ইচ্ছা)',     opts:['mustn\'t','can\'t','don\'t have to','shouldn\'t'],ans:'don\'t have to',exp:'প্রয়োজন নেই → don\'t have to'},
  {q:'You ___ see a doctor. You look sick.',             opts:['must','should','can','will'],  ans:'should',  exp:'পরামর্শ → should'},
  {q:'I ___ have called her — now I feel bad.',          opts:['must','should','can','would'], ans:'should',  exp:'অতীতের আফসোস → should have'},
  {q:'It ___ rain later. (50% সম্ভাবনা)',                opts:['must','will','may','can\'t'],  ans:'may',      exp:'মাঝারি সম্ভাবনা → may'},
  {q:'He ___ be at home — I can see his car. (95% নিশ্চিত)',opts:['might','could','must','may'],ans:'must',    exp:'উচ্চ নিশ্চয়তা → must'},
  {q:'___ you mind opening the window?',                  opts:['Can','Could','Would','Must'],  ans:'Would',    exp:'ভদ্র অনুরোধ → Would you mind'},
  {q:'When I was a child, I ___ play outside every day.',opts:['will','would','must','should'], ans:'would',    exp:'অতীত অভ্যাস → would'},
  {q:'She ___ be at the office — I just saw her at home. (অসম্ভব)',opts:['can\'t','mustn\'t','shouldn\'t','may not'],ans:'can\'t',exp:'অসম্ভব → can\'t'},
];

let score=0,done=false;
function renderQuiz(){
  score=0;done=false;
  const w=document.getElementById('quiz-wrap');
  if(!w)return;
  w.innerHTML=QUIZ.map((q,i)=>`
    <div class="practice-q" id="pq-${i}">
      <div class="pq-text">${i+1}. ${q.q}</div>
      <div class="pq-options">${q.opts.map(o=>`<button class="pq-opt" onclick="checkQ(${i},'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>
      <div class="pq-feedback" id="pf-${i}"></div>
    </div>`).join('')+`<div id="score-wrap"></div>`;
}
window.checkQ=(i,sel)=>{
  const q=QUIZ[i];
  const el=document.getElementById('pq-'+i);
  const fb=document.getElementById('pf-'+i);
  el.querySelectorAll('.pq-opt').forEach(b=>{
    b.onclick=null;
    if(b.textContent===q.ans)b.classList.add('correct');
    else if(b.textContent===sel&&sel!==q.ans)b.classList.add('wrong');
  });
  fb.className='pq-feedback show '+(sel===q.ans?'correct':'wrong');
  fb.textContent=(sel===q.ans?'✅ সঠিক! ':'❌ ভুল। ')+q.exp;
  if(sel===q.ans)score++;
  if([...document.querySelectorAll('.pq-feedback.show')].length===QUIZ.length&&!done){
    done=true;
    const pct=Math.round(score/QUIZ.length*100);
    document.getElementById('score-wrap').innerHTML=`
      <div style="background:rgba(251,146,60,.07);border:1px solid rgba(251,146,60,.2);border-radius:18px;padding:1.5rem;text-align:center;margin-top:1rem;">
        <div style="font-size:2.5rem;font-weight:900;color:var(--orange)">${score}/${QUIZ.length}</div>
        <div style="font-size:1rem;color:var(--sub);margin:.3rem 0;font-family:'Noto Sans Bengali',sans-serif">${pct>=80?'🎉 অসাধারণ!':pct>=60?'👍 ভালো!':'💪 আরো চেষ্টা করো!'}</div>
        <div style="font-size:13px;color:var(--muted);font-family:'Noto Sans Bengali',sans-serif">Accuracy: ${pct}% · XP Earned: ${Math.round(pct/2)} XP</div>
      </div>`;
  }
};
window.resetQuiz=()=>{score=0;done=false;renderQuiz();};

const ORDER=['can','may','must','should','will','compare','practice'];
window.show=(id,idx)=>{
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  document.getElementById('prog').style.width=Math.round(idx/(ORDER.length-1)*100)+'%';
  document.getElementById('main').innerHTML=PANELS[id]();
  document.getElementById('main').scrollTop=0;
  if(id==='practice')renderQuiz();
};

show('can',0);
</script>
</body>
</html>
