<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আপনার Learning Profile — English Shekho</title>
<meta name="robots" content="noindex">
<meta name="es-guest" content="allowed">
<link rel="stylesheet" href="styles/tokens.css">
<style>
  body{min-height:100vh;display:grid;place-items:start center;padding:var(--es-s4)}
  .wrap{width:min(560px,100%);margin-top:clamp(0rem,4vh,2rem)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--es-s3);color:var(--es-sub);font-size:var(--es-fs-sm)}
  .top a{color:var(--es-muted)}
  .es-progress{margin-bottom:var(--es-s5)}
  h1{font-size:var(--es-fs-2xl);line-height:1.3;margin:0 0 var(--es-s2)}
  .hint{color:var(--es-sub);margin:0 0 var(--es-s5);font-size:var(--es-fs-sm)}
  .q{margin:0 0 var(--es-s5)}
  .q h2{font-size:var(--es-fs-md);margin:0 0 var(--es-s3);color:var(--es-indigo-300)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--es-s3)}
  .opts.one-col{grid-template-columns:1fr}
  .opt{display:flex;align-items:center;gap:var(--es-s3);text-align:left;padding:.85rem 1rem;border-radius:var(--es-r-md);cursor:pointer;
    color:var(--es-text);font:500 var(--es-fs-md)/1.3 var(--es-font);background:var(--es-surface-1);border:1px solid var(--es-border-strong);
    transition:border-color var(--es-dur-1),background var(--es-dur-1),transform var(--es-dur-2) var(--es-ease)}
  .opt:hover{transform:translateY(-2px);border-color:var(--es-indigo-400)}
  .opt[aria-checked="true"],.opt[aria-pressed="true"]{background:rgba(91,91,255,.18);border-color:var(--es-indigo-400);box-shadow:0 0 0 2px rgba(124,131,255,.3)}
  .opt .ic{font-size:1.4rem}
  .opt small{display:block;color:var(--es-muted);font-size:var(--es-fs-xs)}
  .nav{display:flex;gap:var(--es-s3);justify-content:space-between;margin-top:var(--es-s5)}
  .err{min-height:1.3em;color:var(--es-danger);font-size:var(--es-fs-sm);margin-top:var(--es-s2)}
  .note{font-size:var(--es-fs-xs);color:var(--es-muted);margin-top:var(--es-s4)}
  .parent{padding:.6rem .9rem;border-radius:var(--es-r-md);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);color:var(--es-cyan-300);font-size:var(--es-fs-sm);margin-top:var(--es-s3)}
</style>
  <link rel="stylesheet" href="styles/ux-polish.css">
</head>
<body>
<main class="wrap es-card">
  <div class="top">
    <span id="stepText" aria-live="polite">প্রশ্ন ১ / ৬</span>
    <a href="dashboard.html" id="skip">এখন না</a>
  </div>
  <div class="es-progress" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="1" style="--value:16%"><span></span></div>

  <div id="stage"></div>
  <p class="err" id="err" role="alert"></p>

  <div class="nav">
    <button type="button" class="es-btn es-btn--ghost" id="back">← পেছনে</button>
    <button type="button" class="es-btn" id="next">পরের প্রশ্ন →</button>
  </div>
  <p class="note">আপনার উত্তর শুধু আপনার শেখার পরিকল্পনা সাজাতে ব্যবহার হয়। পরে যেকোনো সময় বদলাতে পারবেন।</p>
</main>

<script type="module">
import { requireAuth } from "./js/firebase-config.js";
import { OPTIONS, sanitizeProfile, cleanName } from "./learning/profile-schema.js";
import { saveLearningProfile } from "./learning/profile.js";

const $ = (id) => document.getElementById(id);
const bn = (n) => String(n).replace(/\d/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
const params = new URLSearchParams(location.search);
const editMode = params.get("edit") === "1";

const TOTAL = 6;
let step = 0, uid = null;
const A = { name: "", ageGroup: null, level: null, reasons: [], examTarget: null,
            skills: [], dailyMinutes: null, studyTime: null, style: null };

/* ── small DOM helpers (no innerHTML) ── */
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function choice(key, { multi = false, max = 1, oneCol = false, onChange } = {}) {
  const box = el("div", "opts" + (oneCol ? " one-col" : ""));
  box.setAttribute("role", multi ? "group" : "radiogroup");
  const paint = () => box.querySelectorAll(".opt").forEach((b) => {
    const on = multi ? A[key].includes(b.dataset.id) : String(A[key]) === b.dataset.id;
    b.setAttribute(multi ? "aria-pressed" : "aria-checked", on ? "true" : "false");
  });
  OPTIONS[key].forEach((o) => {
    const b = el("button", "opt");
    b.type = "button"; b.dataset.id = String(o.id);
    b.setAttribute("role", multi ? "button" : "radio");
    if (o.icon) b.appendChild(el("span", "ic", o.icon));
    const t = el("span"); t.appendChild(document.createTextNode(o.label));
    if (o.sub) t.appendChild(el("small", null, o.sub));
    b.appendChild(t);
    b.onclick = () => {
      const id = typeof o.id === "number" ? o.id : o.id;
      if (multi) {
        const i = A[key].indexOf(id);
        if (i >= 0) A[key].splice(i, 1);
        else if (A[key].length < max) A[key].push(id);
        else { $("err").textContent = `সর্বোচ্চ ${bn(max)}টি বেছে নিতে পারবেন।`; return; }
      } else A[key] = id;
      $("err").textContent = "";
      paint(); if (onChange) onChange();
    };
    box.appendChild(b);
  });
  paint();
  return box;
}

const section = (title, node) => { const s = el("div", "q"); s.appendChild(el("h2", null, title)); s.appendChild(node); return s; };

/* ── the six questions ── */
const STEPS = [
  { title: "আপনার সম্পর্কে একটু বলুন", hint: "আপনাকে নাম ধরে ডাকতে চাই।",
    render(st) {
      const f = el("div");
      const inp = el("input", "es-input"); inp.id = "name"; inp.maxLength = 40; inp.placeholder = "আপনার নাম";
      inp.autocomplete = "given-name"; inp.value = A.name;
      inp.oninput = () => { A.name = inp.value; };
      const lab = el("label", "es-sr-only", "নাম"); lab.htmlFor = "name";
      f.append(lab, inp);
      const note = el("div", "parent", "👨‍👩‍👧 ১২ বছর বা কম হলে অভিভাবকের সাহায্য নিয়ে শুরু করুন।"); note.hidden = A.ageGroup !== "kid";
      const ages = choice("ageGroup", { onChange: () => { note.hidden = A.ageGroup !== "kid"; } });
      st.append(section("নাম", f), section("আপনার বয়সের ধাপ", ages), note);
    },
    valid: () => cleanName(A.name).length >= 1 && !!A.ageGroup, msg: "নাম লিখুন ও বয়সের ধাপ বেছে নিন।" },
  { title: "আপনার English কেমন?", hint: "নিশ্চিত না হলে “নিশ্চিত নই” বেছে নিন, আমরা পরে level বের করে দেব।",
    render(st) { st.append(choice("level", { oneCol: true })); },
    valid: () => !!A.level, msg: "একটি level বেছে নিন।" },
  { title: "কেন English শিখছেন?", hint: "সর্বোচ্চ ৩টি বেছে নিন।",
    render(st) {
      const exam = el("div"); exam.hidden = !A.reasons.includes("exam");
      const paintExam = () => { exam.hidden = !A.reasons.includes("exam"); };
      const r = choice("reasons", { multi: true, max: 3, onChange: paintExam });
      const e = choice("examTarget"); exam.appendChild(section("কোন পরীক্ষা?", e));
      st.append(r, exam);
    },
    valid: () => A.reasons.length >= 1, msg: "অন্তত একটি কারণ বেছে নিন।" },
  { title: "কোন skill-এ উন্নতি চান?", hint: "সর্বোচ্চ ৪টি বেছে নিন।",
    render(st) { st.append(choice("skills", { multi: true, max: 4 })); },
    valid: () => A.skills.length >= 1, msg: "অন্তত একটি skill বেছে নিন।" },
  { title: "প্রতিদিন কত সময় দিতে পারবেন?", hint: "ছোট লক্ষ্য দিয়ে শুরু করাই ভালো।",
    render(st) { st.append(choice("dailyMinutes", { oneCol: true })); },
    valid: () => !!A.dailyMinutes, msg: "প্রতিদিনের সময় বেছে নিন।" },
  { title: "কখন ও কীভাবে শিখতে ভালো লাগে?", hint: "এটা দিয়ে আপনার পরিকল্পনা সাজানো হবে।",
    render(st) { st.append(section("পছন্দের সময়", choice("studyTime")), section("শেখার ধরন", choice("style"))); },
    valid: () => !!A.studyTime && !!A.style, msg: "সময় ও শেখার ধরন দুটোই বেছে নিন।" },
];

function draw() {
  const s = STEPS[step];
  const stage = $("stage"); stage.textContent = "";
  const h = el("h1", null, s.title), p = el("p", "hint", s.hint);
  stage.append(h, p); s.render(stage);
  $("stepText").textContent = `প্রশ্ন ${bn(step + 1)} / ${bn(TOTAL)}`;
  const bar = $("bar"); bar.setAttribute("aria-valuenow", String(step + 1)); bar.style.setProperty("--value", ((step + 1) / TOTAL * 100) + "%");
  $("back").style.visibility = step === 0 ? "hidden" : "visible";
  $("next").textContent = step === TOTAL - 1 ? "শুরু করি 🚀" : "পরের প্রশ্ন →";
  $("err").textContent = "";
  h.tabIndex = -1; h.focus({ preventScroll: true });
}

$("back").onclick = () => { if (step > 0) { step--; draw(); } };
$("next").onclick = async () => {
  const s = STEPS[step];
  if (!s.valid()) { $("err").textContent = s.msg; return; }
  if (step < TOTAL - 1) { step++; draw(); return; }
  // final step → save
  $("next").disabled = true; $("err").textContent = "";
  try {
    sanitizeProfile(A);
    await saveLearningProfile(uid, A, A.name);
    sessionStorage.removeItem("es-onb-skip");
    location.replace(A.level === "unsure" ? "placement.html" : "dashboard.html");
  } catch (e) {
    console.warn("save profile failed", e);
    $("err").textContent = "সেভ করা যায়নি। Internet পরীক্ষা করে আবার চেষ্টা করুন।";
    $("next").disabled = false;
  }
};
$("skip").onclick = () => { try { sessionStorage.setItem("es-onb-skip", "1"); } catch (_) {} };

requireAuth((user, d = {}) => {
  uid = user.uid;
  const lp = d.learningProfile;
  if (lp && !editMode) { location.replace("dashboard.html"); return; }
  if (lp) {
    Object.assign(A, { ageGroup: lp.ageGroup, level: lp.levelPending ? "unsure" : lp.level, reasons: [...(lp.reasons || [])],
      examTarget: lp.examTarget, skills: [...(lp.skills || [])], dailyMinutes: lp.dailyMinutes, studyTime: lp.studyTime, style: lp.style });
  }
  const n = d.displayName || user.displayName || "";
  A.name = /^guest$/i.test(n) ? "" : n;
  draw();
});
</script>
</body>
</html>
