<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভুল থেকে শেখা — English Shekho</title>
<meta name="robots" content="noindex">
<meta name="es-guest" content="allowed">
<link rel="stylesheet" href="styles/tokens.css">
<style>
  body{min-height:100vh;padding:var(--es-s4);display:grid;place-items:start center}
  .wrap{width:min(600px,100%);margin-top:clamp(0rem,3vh,1.5rem)}
  .top{display:flex;justify-content:space-between;margin-bottom:var(--es-s4)}
  .top a{color:var(--es-sub);text-decoration:none;font-size:var(--es-fs-sm)}
  h1{font-size:var(--es-fs-2xl);margin:0 0 var(--es-s2)}
  .lead{color:var(--es-sub);margin:0 0 var(--es-s4)}
  .q{font-size:var(--es-fs-xl);line-height:1.5;font-weight:600;margin:var(--es-s3) 0}
  .opts{display:grid;gap:var(--es-s3)}
  .opt{text-align:left;padding:.9rem 1rem;border-radius:var(--es-r-md);cursor:pointer;color:var(--es-text);font:500 var(--es-fs-md)/1.3 var(--es-font);background:var(--es-surface-1);border:1px solid var(--es-border-strong)}
  .opt:hover:not(:disabled){border-color:var(--es-indigo-400)}
  .opt.correct{border-color:var(--es-success);background:rgba(52,211,153,.14)}
  .opt.wrong{border-color:var(--es-danger);background:rgba(251,113,133,.14)}
  .why{margin-top:var(--es-s3);padding:.7rem .9rem;border-radius:var(--es-r-md);background:rgba(124,131,255,.1);color:var(--es-sub);font-size:var(--es-fs-sm)}
  .row{display:flex;gap:var(--es-s3);flex-wrap:wrap;margin-top:var(--es-s4)}
  .stats{display:flex;gap:var(--es-s3);justify-content:center;flex-wrap:wrap;margin:var(--es-s4) 0}
  .err{min-height:1.3em;color:var(--es-danger);font-size:var(--es-fs-sm);margin-top:var(--es-s2);text-align:center}
  .center{text-align:center}
</style>
  <link rel="stylesheet" href="styles/ux-polish.css">
</head>
<body>
<main class="wrap">
  <div class="top"><a href="dashboard.html">← Dashboard</a><a href="grammar.html">সব Grammar topic</a></div>
  <div class="es-card" id="view"><p class="lead">লোড হচ্ছে…</p></div>
  <p class="err" id="err" role="alert"></p>
</main>

<script type="module">
import { requireAuth, db, doc, setDoc, updateDoc, getDocs, collection, query, where, limit, increment } from "./js/firebase-config.js";
import { shuffled } from "./learning/grammar-practice.js";
import { isoDay } from "./learning/srs.js";

const $ = (id) => document.getElementById(id);
const bn = (n) => String(n).replace(/\d/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const view = (...n) => { const v = $("view"); v.textContent = ""; v.append(...n); $("err").textContent = ""; };
const SESSION = 8;                                   // small sessions on purpose

let uid = null, items = [], pos = 0, fixed = 0, tried = 0, stillOpen = 0;
const refOf = (id) => doc(db, "users", uid, "grammarMistakes", id);

async function start() {
  const snap = await getDocs(query(collection(db, "users", uid, "grammarMistakes"), where("fixed", "==", false), limit(40)));
  const all = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => Array.isArray(m.opts) && m.opts.includes(m.correct));
  items = shuffled(all).slice(0, SESSION);
  stillOpen = all.length;
  pos = 0; fixed = 0; tried = 0;
  if (!items.length) {
    const box = el("div", "center");
    box.append(el("h1", "es-gradient-text", "কোনো ভুল জমে নেই 🎉"),
      el("p", "lead", "যেসব grammar প্রশ্নে ভুল হয় সেগুলো এখানে জমা হয়। এখন কিছু বাকি নেই। নতুন topic চেষ্টা করুন।"));
    const a = el("a", "es-btn", "Grammar topic দেখুন →"); a.href = "grammar.html"; box.appendChild(a);
    return view(box);
  }
  show();
}

function show() {
  if (pos >= items.length) return summary();
  const m = items[pos];
  const box = el("div");
  box.append(el("span", "es-badge es-badge--info", `${bn(pos + 1)} / ${bn(items.length)} · ${m.topic.toUpperCase()}`));
  const q = el("div", "q", m.q); q.lang = "en"; box.appendChild(q);
  const opts = el("div", "opts"); const info = el("div", "why"); info.hidden = true;
  shuffled(m.opts).forEach((o) => {
    const b = el("button", "opt", o); b.type = "button"; b.lang = "en";
    b.onclick = async () => {
      opts.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const right = o === m.correct; tried++;
      b.classList.add(right ? "correct" : "wrong");
      if (!right) [...opts.children].find((x) => x.textContent === m.correct)?.classList.add("correct");
      info.hidden = false; info.textContent = (right ? "✅ ঠিক! " : "❌ সঠিক উত্তর: " + m.correct + ". ") + (m.why || "");
      try {
        if (right) {
          await setDoc(refOf(m.id), { fixed: true, last: isoDay() }, { merge: true });
          await updateDoc(doc(db, "users", uid), { "grammarProgress.openMistakes": increment(-1) });
          fixed++; stillOpen--;
        } else await setDoc(refOf(m.id), { count: increment(1), last: isoDay() }, { merge: true });
      } catch (e) { console.warn(e); $("err").textContent = "সেভ করা যায়নি, তবে চালিয়ে যেতে পারেন।"; }
      const nx = el("button", "es-btn es-btn--sm", pos + 1 < items.length ? "পরের প্রশ্ন →" : "শেষ করি"); nx.type = "button"; nx.style.marginTop = "10px";
      nx.onclick = () => { pos++; show(); }; info.appendChild(document.createElement("br")); info.appendChild(nx);
    };
    opts.appendChild(b);
  });
  box.append(opts, info); view(box);
}

function summary() {
  const box = el("div", "center");
  box.append(el("h1", "es-gradient-text", fixed === tried ? "চমৎকার! 🎉" : "ভালো চেষ্টা 👏"),
    el("p", "lead", `${bn(tried)}টির মধ্যে ${bn(fixed)}টি এবার ঠিক হয়েছে। যেগুলো ঠিক হয়নি সেগুলো পরে আবার আসবে, কোনো তাড়া নেই।`));
  const st = el("div", "stats");
  st.append(el("span", "es-badge es-badge--success", `✅ ${bn(fixed)} ঠিক`), el("span", "es-badge", `🔁 ${bn(Math.max(0, stillOpen))}টি বাকি`));
  const row = el("div", "row"); row.style.justifyContent = "center";
  const again = el("button", "es-btn", "আরও কিছু করি"); again.type = "button"; again.onclick = () => start();
  if (stillOpen <= 0) again.hidden = true;
  const back = el("a", "es-btn es-btn--secondary", "Dashboard"); back.href = "dashboard.html";
  row.append(again, back); box.append(st, row); view(box);
}

requireAuth((u) => { uid = u.uid; start().catch((e) => { console.warn(e); view(el("p", "lead", "লোড করা যায়নি। Internet পরীক্ষা করে রিফ্রেশ করুন।")); }); });
</script>
</body>
</html>
