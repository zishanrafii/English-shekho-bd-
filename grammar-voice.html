<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active &amp; Passive Voice — English Shekho Grammar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080f;--surface:#080e1a;--surface2:#0c1322;
  --border:rgba(255,255,255,.055);--gold:#f5c842;--teal:#2dd4bf;
  --rose:#fb7185;--indigo:#818cf8;--emerald:#34d399;--orange:#fb923c;
  --muted:#64748b;--sub:#94a3b8;--text:#f0f4f8;--acc:var(--rose);--acc2:#f472b6;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 0% 0%,rgba(251,113,133,.06),transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 100%,rgba(244,114,182,.05),transparent 55%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.007) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.007) 1px,transparent 1px);
  background-size:52px 52px;}

.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(4,8,15,.9);backdrop-filter:blur(20px);z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.4);}
.tb-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.tb-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(251,113,133,.2),rgba(244,114,182,.1));border:1px solid rgba(251,113,133,.3);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.tb-name{font-size:1rem;font-weight:800;background:linear-gradient(135deg,#fb7185,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px;}
.tb-page{font-size:.85rem;color:var(--muted);font-weight:600;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tb-btn{padding:.35rem .85rem;border-radius:20px;font-size:12px;font-weight:600;color:var(--sub);text-decoration:none;border:1px solid var(--border);background:rgba(255,255,255,.03);transition:.2s;font-family:'Outfit',sans-serif;}
.tb-btn:hover{color:var(--text);border-color:rgba(251,113,133,.3);}
.nav-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,rgba(245,200,66,.15),rgba(45,212,191,.15));border:2px solid rgba(245,200,66,.2);display:flex;align-items:center;justify-content:center;font-size:.9rem;overflow:hidden;cursor:pointer;flex-shrink:0;}
.nav-av img{width:100%;height:100%;object-fit:cover;}

.layout{display:flex;height:calc(100vh - 57px);}
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:rgba(8,14,26,.6);padding:.8rem .6rem;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(251,113,133,.2);border-radius:3px;}
.sb-section-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;padding:.5rem .7rem .3rem;font-family:'JetBrains Mono',monospace;}
.sb-item{display:flex;align-items:center;gap:8px;padding:.5rem .7rem;border-radius:10px;cursor:pointer;transition:.2s;border:1px solid transparent;margin-bottom:2px;}
.sb-item:hover{background:rgba(251,113,133,.06);border-color:rgba(251,113,133,.1);}
.sb-item.active{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.25);color:var(--rose);}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-text{font-size:12.5px;font-weight:600;flex:1;}
.sb-lvl{font-size:9px;font-family:'JetBrains Mono',monospace;padding:1px 6px;border-radius:20px;font-weight:700;flex-shrink:0;}
.lvl-a1{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2);}
.lvl-a2{background:rgba(245,200,66,.1);color:#f5c842;border:1px solid rgba(245,200,66,.2);}
.lvl-b1{background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.2);}
.lvl-b2{background:rgba(251,113,133,.1);color:#fb7185;border:1px solid rgba(251,113,133,.2);}

.main{flex:1;overflow-y:auto;padding:2rem 2.2rem 4rem;}
.main::-webkit-scrollbar{width:4px;}
.main::-webkit-scrollbar-thumb{background:rgba(251,113,133,.15);border-radius:3px;}

.lesson-header{margin-bottom:2rem;}
.lesson-breadcrumb{font-size:11px;color:var(--muted);margin-bottom:.6rem;font-family:'JetBrains Mono',monospace;}
.lesson-title{font-size:2rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.5rem;line-height:1.15;}
.lesson-title span{background:linear-gradient(135deg,#fb7185,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.lesson-desc{font-size:14px;color:var(--sub);line-height:1.75;max-width:640px;font-family:'Noto Sans Bengali',sans-serif;}
.lesson-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:.8rem;}
.lmeta{font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--border);padding:4px 12px;border-radius:20px;}

.card{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1.4rem;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,linear-gradient(90deg,var(--rose),#f472b6));opacity:.6;}
.card-title{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:1.1rem;display:flex;align-items:center;gap:.5rem;font-family:'JetBrains Mono',monospace;}
.card-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}

/* TRANSFORM DIAGRAM */
.transform{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:1rem;}
.tf-box{border-radius:14px;padding:1rem 1.2rem;border:1px solid;}
.tf-box.active{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.2);}
.tf-box.passive{background:rgba(251,113,133,.06);border-color:rgba(251,113,133,.2);}
.tf-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:.4rem;font-family:'JetBrains Mono',monospace;}
.tf-box.active .tf-label{color:var(--emerald);}
.tf-box.passive .tf-label{color:var(--rose);}
.tf-text{font-size:14px;line-height:1.6;}
.tf-arrow{font-size:1.5rem;color:var(--rose);}
.tf-sub{font-size:11px;color:var(--muted);font-family:'Noto Sans Bengali',sans-serif;margin-top:.3rem;}

.formula{background:rgba(251,113,133,.06);border:1px solid rgba(251,113,133,.18);border-radius:14px;padding:1rem 1.4rem;margin-bottom:1rem;}
.formula-label{font-size:10px;color:var(--rose);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:.4rem;font-family:'JetBrains Mono',monospace;}
.formula-text{font-size:1rem;color:var(--text);line-height:1.8;font-family:'JetBrains Mono',monospace;}
.hl{color:var(--gold);font-weight:700;}
.hl2{color:var(--teal);font-weight:700;}
.hl3{color:var(--rose);font-weight:700;}
.hl4{color:var(--indigo);font-weight:700;}

.examples{display:flex;flex-direction:column;gap:.6rem;}
.ex{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;padding:.8rem 1.1rem;transition:.2s;}
.ex:hover{border-color:rgba(251,113,133,.2);transform:translateX(4px);}
.ex-en{font-size:14px;font-weight:600;margin-bottom:.25rem;}
.ex-bn{font-size:12.5px;color:var(--muted);font-family:'Noto Sans Bengali',sans-serif;}
.ex-tag{font-size:10px;font-family:'JetBrains Mono',monospace;padding:1px 8px;border-radius:20px;margin-left:8px;font-weight:700;background:rgba(251,113,133,.1);color:var(--rose);}

.gtable{width:100%;border-collapse:collapse;font-size:13px;}
.gtable th{background:rgba(251,113,133,.08);color:var(--rose);font-weight:700;padding:.65rem .9rem;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid rgba(251,113,133,.15);}
.gtable td{padding:.6rem .9rem;border-bottom:1px solid rgba(255,255,255,.04);}
.gtable tr:last-child td{border-bottom:none;}
.gtable tr:hover td{background:rgba(255,255,255,.02);}
.gtable td:first-child{color:var(--text);font-weight:600;}
.gtable .form{color:var(--teal);font-family:'JetBrains Mono',monospace;font-size:12.5px;}
.gtable .bn{color:var(--muted);font-family:'Noto Sans Bengali',sans-serif;font-size:12px;}
.correct{color:var(--emerald)!important;font-weight:700;}
.wrong{color:var(--rose)!important;}

.tip{background:rgba(251,113,133,.06);border:1px solid rgba(251,113,133,.2);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;display:flex;gap:.8rem;}
.tip-icon{font-size:1.3rem;flex-shrink:0;}
.tip-text{font-size:13px;line-height:1.7;font-family:'Noto Sans Bengali',sans-serif;color:var(--sub);}
.tip-text strong{color:var(--rose);}
.warn{background:rgba(251,113,133,.05);border:1px solid rgba(251,113,133,.18);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;display:flex;gap:.8rem;}
.warn-text{font-size:13px;line-height:1.7;font-family:'Noto Sans Bengali',sans-serif;color:var(--sub);}
.warn-text strong{color:var(--rose);}

.practice-q{background:rgba(251,113,133,.04);border:1px solid rgba(251,113,133,.15);border-radius:14px;padding:1.2rem;margin-bottom:.8rem;}
.pq-text{font-size:14px;font-weight:600;margin-bottom:.6rem;}
.pq-options{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem;}
.pq-opt{padding:.4rem 1rem;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;transition:.2s;font-family:'JetBrains Mono',monospace;}
.pq-opt:hover{border-color:rgba(251,113,133,.3);color:var(--rose);}
.pq-opt.correct{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--emerald);}
.pq-opt.wrong{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3);color:var(--rose);}
.pq-feedback{font-size:13px;padding:.5rem .8rem;border-radius:8px;display:none;font-family:'Noto Sans Bengali',sans-serif;margin-top:.4rem;}
.pq-feedback.show{display:block;}
.pq-feedback.correct{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);color:var(--emerald);}
.pq-feedback.wrong{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.2);color:var(--rose);}

.lesson-nav{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap;align-items:center;}
.btn-prev,.btn-next{display:flex;align-items:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;transition:.2s;text-decoration:none;}
.btn-prev:hover,.btn-next:hover{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.25);color:var(--text);}
.btn-next{background:linear-gradient(135deg,rgba(251,113,133,.12),rgba(244,114,182,.08));border-color:rgba(251,113,133,.25);color:var(--text);margin-left:auto;}
.btn-quiz-big{background:linear-gradient(135deg,#fb7185,#f472b6);color:#000;border:none;border-radius:14px;padding:.75rem 1.6rem;font-size:14px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif;transition:.2s;}
.btn-quiz-big:hover{opacity:.88;transform:translateY(-1px);}

.progress-strip{position:fixed;top:57px;left:0;right:0;height:3px;z-index:99;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--rose),#f472b6);transition:width .3s;}

@media(max-width:768px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;height:auto;max-height:200px;border-right:none;border-bottom:1px solid var(--border);}
  .main{padding:1.2rem 1rem 3rem;}
  .transform{grid-template-columns:1fr;}
  .tf-arrow{transform:rotate(90deg);text-align:center;}
}
</style>

  <meta name="theme-color" content="#101827">
  <link rel="stylesheet" href="styles/ux-polish.css">
</head>
<body>

<div class="progress-strip"><div class="progress-fill" id="prog" style="width:0%"></div></div>

<div class="topbar">
  <a class="tb-logo" href="grammar.html">
    <div class="tb-icon">📚</div>
    <div class="tb-name">English Shekho</div>
  </a>
  <div class="tb-sep"></div>
  <div class="tb-page">🔄 Active &amp; Passive Voice</div>
  <div class="tb-right">
    <a class="tb-btn" href="grammar.html">← Grammar Hub</a>
    <a class="tb-btn" href="dashboard.html">Dashboard</a>
    <div class="nav-av" id="nav-av" onclick="location.href='profile.html'">👤</div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sb-section-label">Voice</div>
    <div class="sb-item active" data-id="intro" onclick="show('intro',0)">
      <span class="sb-dot" style="background:#fb7185"></span><span class="sb-text">Active vs Passive — Intro</span><span class="sb-lvl lvl-a2">A2</span>
    </div>
    <div class="sb-item" data-id="present" onclick="show('present',1)">
      <span class="sb-dot" style="background:#34d399"></span><span class="sb-text">Present Tenses</span><span class="sb-lvl lvl-a2">A2</span>
    </div>
    <div class="sb-item" data-id="past" onclick="show('past',2)">
      <span class="sb-dot" style="background:#f5c842"></span><span class="sb-text">Past Tenses</span><span class="sb-lvl lvl-b1">B1</span>
    </div>
    <div class="sb-item" data-id="future" onclick="show('future',3)">
      <span class="sb-dot" style="background:#818cf8"></span><span class="sb-text">Future Tenses</span><span class="sb-lvl lvl-b1">B1</span>
    </div>
    <div class="sb-item" data-id="modal" onclick="show('modal',4)">
      <span class="sb-dot" style="background:#fb923c"></span><span class="sb-text">Modal &amp; Imperative</span><span class="sb-lvl lvl-b2">B2</span>
    </div>
    <div class="sb-item" data-id="practice" onclick="show('practice',5)">
      <span class="sb-dot" style="background:#2dd4bf"></span><span class="sb-text">Practice Quiz</span>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script>
const PANELS={

'intro':()=>`
<div class="lesson-header">
  <div class="lesson-breadcrumb">Grammar → Voice → Introduction</div>
  <div class="lesson-meta"><span class="sb-lvl lvl-a2" style="padding:4px 12px">A2</span><span class="lmeta">⚡ 75 XP</span><span class="lmeta">⏱️ 15 min</span></div>
  <div class="lesson-title" style="margin-top:.5rem"><span>Active vs Passive Voice — পরিচিতি</span></div>
  <div class="lesson-desc">Active Voice-এ subject কাজ করে। Passive Voice-এ subject কাজটি গ্রহণ করে — কে কাজটি করেছে তা গুরুত্বপূর্ণ নয় বা অজানা।</div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,#34d399,#fb7185)">
  <div class="card-title">🔄 Basic Transformation</div>
  <div class="transform">
    <div class="tf-box active">
      <div class="tf-label">Active</div>
      <div class="tf-text"><b>The chef</b> cooks <b>the food</b>.</div>
      <div class="tf-sub">শেফ খাবার রান্না করে। (subject = কাজ করছে)</div>
    </div>
    <div class="tf-arrow">→</div>
    <div class="tf-box passive">
      <div class="tf-label">Passive</div>
      <div class="tf-text"><b>The food</b> is cooked <b>by the chef</b>.</div>
      <div class="tf-sub">খাবারটি শেফ দ্বারা রান্না করা হয়। (subject = কাজ পাচ্ছে)</div>
    </div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--rose),#f472b6)">
  <div class="card-title">📐 General Formula</div>
  <div class="formula"><div class="formula-label">Active</div>
    <div class="formula-text"><span class="hl">Subject</span> + Verb + <span class="hl2">Object</span></div>
  </div>
  <div class="formula"><div class="formula-label">Passive</div>
    <div class="formula-text"><span class="hl2">Object</span> + <span class="hl">be (am/is/are/was/were...)</span> + <span class="hl3">V3 (Past Participle)</span> + (by <span class="hl">Subject</span>)</div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--gold),var(--orange))">
  <div class="card-title">📌 Active → Passive করার ধাপ</div>
  <table class="gtable">
    <tr><th>ধাপ</th><th>কী করতে হবে</th></tr>
    <tr><td>১</td><td>Active-এর <span class="form">object</span> → Passive-এর <span class="form">subject</span>।</td></tr>
    <tr><td>২</td><td>Verb-কে <span class="form">be + V3</span> এ পরিবর্তন করো (tense অনুযায়ী be পরিবর্তন হয়)।</td></tr>
    <tr><td>৩</td><td>Active-এর <span class="form">subject</span> → "by + subject" (object pronoun এ পরিণত হয়)।</td></tr>
    <tr><td>৪</td><td>"by + agent" বাদ দেওয়া যায় যদি কে করেছে গুরুত্বপূর্ণ না হয়।</td></tr>
  </table>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--teal),var(--emerald))">
  <div class="card-title">💬 Examples</div>
  <div class="examples">
    <div class="ex"><div class="ex-en"><b>Active:</b> Rina writes a letter. → <b>Passive:</b> A letter is written by Rina.</div><div class="ex-bn">রিনা একটা চিঠি লেখে। → একটা চিঠি রিনা দ্বারা লেখা হয়।</div></div>
    <div class="ex"><div class="ex-en"><b>Active:</b> They built this house in 2010. → <b>Passive:</b> This house was built in 2010 (by them).</div><div class="ex-bn">তারা ২০১০ সালে এই বাড়িটি তৈরি করেছিল। → বাড়িটি ২০১০ সালে তৈরি হয়েছিল।</div></div>
  </div>
</div>

<div class="tip"><span class="tip-icon">💡</span>
  <div class="tip-text"><strong>কখন Passive ব্যবহার করবো?</strong><br>
  • কে করেছে তা অজানা/গুরুত্বপূর্ণ নয়: "My phone was stolen."<br>
  • Formal/scientific লেখায়: "The experiment was conducted carefully."<br>
  • কাজটার উপর জোর দিতে (কে করেছে তার চেয়ে কী হয়েছে গুরুত্বপূর্ণ)</div>
</div>

<div class="warn"><span style="font-size:1.2rem">⚠️</span>
  <div class="warn-text"><strong>Intransitive verbs (যাদের object নেই)</strong> — যেমন: sleep, arrive, go, die — এগুলোর কোনো Passive form হয় না। ❌ "Was slept by him" — ভুল!</div>
</div>

<div class="lesson-nav">
  <a class="btn-prev" href="grammar-modals.html">← Modals</a>
  <button class="btn-quiz-big" onclick="show('practice',5)">✍️ Practice</button>
  <button class="btn-next" onclick="show('present',1)">Present Tenses →</button>
</div>`,

'present':()=>`
<div class="lesson-header">
  <div class="lesson-breadcrumb">Grammar → Voice → Present Tenses</div>
  <div class="lesson-meta"><span class="sb-lvl lvl-a2" style="padding:4px 12px">A2</span><span class="lmeta">⚡ 75 XP</span><span class="lmeta">⏱️ 18 min</span></div>
  <div class="lesson-title" style="margin-top:.5rem"><span>Passive Voice — Present Tenses</span></div>
  <div class="lesson-desc">Present Simple ও Present Continuous এর Passive form — am/is/are + V3 ব্যবহার করো।</div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,#34d399,#fb7185)">
  <div class="card-title">📐 Present Simple Passive</div>
  <div class="formula"><div class="formula-label">Active</div><div class="formula-text">Subject + V1/V+s/es + Object</div></div>
  <div class="formula"><div class="formula-label">Passive</div><div class="formula-text">Object + <span class="hl">am/is/are</span> + <span class="hl3">V3</span> + (by Subject)</div></div>
  <div class="transform" style="margin-top:1rem">

    <div class="tf-arrow">→</div>
    <div class="tf-box passive"><div class="tf-label">Passive</div><div class="tf-text">The room <b>is cleaned</b> by Tom every day.</div></div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--rose),#f472b6)">
  <div class="card-title">📐 Present Continuous Passive</div>
  <div class="formula"><div class="formula-label">Active</div><div class="formula-text">Subject + am/is/are + V+ing + Object</div></div>
  <div class="formula"><div class="formula-label">Passive</div><div class="formula-text">Object + <span class="hl">am/is/are being</span> + <span class="hl3">V3</span> + (by Subject)</div></div>
  <div class="transform" style="margin-top:1rem">
    <div class="tf-box active"><div class="tf-label">Active</div><div class="tf-text">They <b>are building</b> a bridge.</div></div>
    <div class="tf-arrow">→</div>
    <div class="tf-box passive"><div class="tf-label">Passive</div><div class="tf-text">A bridge <b>is being built</b> (by them).</div></div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--gold),var(--orange))">
  <div class="card-title">📐 Present Perfect Passive</div>
  <div class="formula"><div class="formula-label">Active</div><div class="formula-text">Subject + have/has + V3 + Object</div></div>
  <div class="formula"><div class="formula-label">Passive</div><div class="formula-text">Object + <span class="hl">have/has been</span> + <span class="hl3">V3</span> + (by Subject)</div></div>
  <div class="transform" style="margin-top:1rem">
    <div class="tf-box active"><div class="tf-label">Active</div><div class="tf-text">She <b>has finished</b> the project.</div></div>
    <div class="tf-arrow">→</div>
    <div class="tf-box passive"><div class="tf-label">Passive</div><div class="tf-text">The project <b>has been finished</b> (by her).</div></div>
  </div>
</div>

<div class="card" style="--card-accent:linear-gradient(90deg,var(--teal),var(--emerald))">
  <div class="card-title">💬 আরও Examples</div>
  <div class="examples">
    <div class="ex"><div class="ex-en">English <b>is spoken</b> all over the world.</div><div class="ex-bn">বিশ্বজুড়ে English বলা হয়।</div></div>
    <div class="ex"><div class="ex-en">The letters <b>are delivered</b> every morning.</div><div class="ex-bn">চিঠিগুলো প্রতি সকালে বিতরণ করা হয়।</div></div>

  </div>
</div>

<div class="tip"><span class="tip-icon">💡</span>
  <div class="tip-text"><strong>be এর form মনে রাখো:</strong> Simple → am/is/are, Continuous → am/is/are <strong>being</strong>, Perfect → have/has <strong>been</strong>। প্রতিটাতে <strong>V3</strong> থাকবে।</div>

const QUIZ=[
  {q:'Active: "Tom cleans the room." → Passive:', opts:['The room cleans Tom.','The room is cleaned by Tom.','The room was cleaned by Tom.','The room cleaned by Tom.'], ans:'The room is cleaned by Tom.', exp:'Present Simple Passive → is + V3'},
  {q:'Active: "They built this house in 2010." → Passive:', opts:['This house built in 2010.','This house is built in 2010.','This house was built in 2010.','This house has built in 2010.'], ans:'This house was built in 2010.', exp:'Past Simple Passive → was + V3'},
  {q:'Active: "She has finished the project." → Passive:', opts:['The project has been finished.','The project is finished.','The project was finished.','The project has finished.'], ans:'The project has been finished.', exp:'Present Perfect Passive → has been + V3'},
  {q:'Active: "They are building a bridge." → Passive:', opts:['A bridge is built.','A bridge is being built.','A bridge was being built.','A bridge has been built.'], ans:'A bridge is being built.', exp:'Present Continuous Passive → is being + V3'},
  {q:'Active: "You must finish this work." → Passive:', opts:['This work must finish.','This work must be finished.','This work is must finished.','This work must been finished.'], ans:'This work must be finished.', exp:'Modal Passive → must be + V3'},
  {q:'Active: "The company will launch a new product." → Passive:', opts:['A new product will launch.','A new product is launched.','A new product will be launched.','A new product will been launched.'], ans:'A new product will be launched.', exp:'Future Simple Passive → will be + V3'},
  {q:'Active: "Close the door!" → Passive:', opts:['The door is closed!','Let the door be closed!','The door closed!','Let the door closing!'], ans:'Let the door be closed!', exp:'Imperative Passive → Let + Object + be + V3'},
  {q:'Active: "She had finished the report before noon." → Passive:', opts:['The report was finished.','The report has been finished.','The report had been finished before noon.','The report had finished before noon.'], ans:'The report had been finished before noon.', exp:'Past Perfect Passive → had been + V3'},
  {q:'English ___ all over the world.', opts:['speaks','is spoken','spoke','was spoken'], ans:'is spoken', exp:'সাধারণ সত্য, present passive → is spoken'},
  {q:'The bridge ___ when I passed by.', opts:['repaired','was repairing','was being repaired','is repaired'], ans:'was being repaired', exp:'Past Continuous Passive → was being + V3'},
  {q:'This medicine ___ twice a day.', opts:['should take','should taken','should be taken','should be take'], ans:'should be taken', exp:'Modal Passive → should be + V3'},
  {q:'By next year, the project ___ .', opts:['will finish','will be finished','will have been finished','has been finished'], ans:'will have been finished', exp:'Future Perfect Passive → will have been + V3'},
];

let score=0,done=false;
function renderQuiz(){
  score=0;done=false;
  const w=document.getElementById('quiz-wrap');
  if(!w)return;
  w.innerHTML=QUIZ.map((q,i)=>`
    <div class="practice-q" id="pq-${i}">
      <div class="pq-text">${i+1}. ${q.q}</div>
      <div class="pq-options">${q.opts.map(o=>`<button class="pq-opt" onclick="checkQ(${i},'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>
      <div class="pq-feedback" id="pf-${i}"></div>
    </div>`).join('')+`<div id="score-wrap"></div>`;
}
window.checkQ=(i,sel)=>{
  const q=QUIZ[i];
  const el=document.getElementById('pq-'+i);
  const fb=document.getElementById('pf-'+i);
  el.querySelectorAll('.pq-opt').forEach(b=>{
    b.onclick=null;
    if(b.textContent===q.ans)b.classList.add('correct');
    else if(b.textContent===sel&&sel!==q.ans)b.classList.add('wrong');
  });
  fb.className='pq-feedback show '+(sel===q.ans?'correct':'wrong');
  fb.textContent=(sel===q.ans?'✅ সঠিক! ':'❌ ভুল। ')+q.exp;
  if(sel===q.ans)score++;
  if([...document.querySelectorAll('.pq-feedback.show')].length===QUIZ.length&&!done){
    done=true;
    const pct=Math.round(score/QUIZ.length*100);
    document.getElementById('score-wrap').innerHTML=`
      <div style="background:rgba(251,113,133,.07);border:1px solid rgba(251,113,133,.2);border-radius:18px;padding:1.5rem;text-align:center;margin-top:1rem;">
        <div style="font-size:2.5rem;font-weight:900;color:var(--rose)">${score}/${QUIZ.length}</div>
        <div style="font-size:1rem;color:var(--sub);margin:.3rem 0;font-family:'Noto Sans Bengali',sans-serif">${pct>=80?'🎉 অসাধারণ!':pct>=60?'👍 ভালো!':'💪 আরো চেষ্টা করো!'}</div>
        <div style="font-size:13px;color:var(--muted);font-family:'Noto Sans Bengali',sans-serif">Accuracy: ${pct}% · XP Earned: ${Math.round(pct/2)} XP</div>
      </div>`;
  }
};
window.resetQuiz=()=>{score=0;done=false;renderQuiz();};

const ORDER=['intro','present','past','future','modal','practice'];
window.show=(id,idx)=>{
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  document.getElementById('prog').style.width=Math.round(idx/(ORDER.length-1)*100)+'%';
  document.getElementById('main').innerHTML=PANELS[id]();
  document.getElementById('main').scrollTop=0;
  if(id==='practice')renderQuiz();
};

show('intro',0);
</script>
</body>
</html>
